server {
    listen 0.0.0.0:65480;
    server_name <HOSTNAME>;

    if ($request_method !~ ^(GET|POST)$ )
    {
        return 405;
    }

    access_log /var/log/nginx/tracker_access.log;
    error_log /var/log/nginx/tracker_error.log;

    root /var/www/tracker/htdocs;

    location /ws/ {
        proxy_pass    http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass    http://127.0.0.1:5004;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 0.0.0.0:443 ssl http2;
    server_name <HOSTNAME>;

    access_log /var/log/nginx/tracker_access.log;
    error_log /var/log/nginx/tracker_error.log;

    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;

    include /etc/nginx/ssl-secure.conf;

    if ($request_method !~ ^(GET|HEAD|POST)$ )
    {
        return 405;
    }

    root /var/www/tracker/htdocs;

    location ~ /(css|js|icons|img)/ {
        root /var/www/tracker/static;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/html text/css application/javascript application/json;

    location /ws/ {
        proxy_pass    http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass    http://127.0.0.1:5004;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Content-Security-Policy "script-src * 'unsafe-inline' 'unsafe-eval' data: blob:;" always;
    }
}
